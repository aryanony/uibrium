name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build library
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Verify package exports
        run: |
          # Verify the build output exists and has expected files
          test -f packages/ui/dist/index.js || (echo "❌ ESM build missing" && exit 1)
          test -f packages/ui/dist/index.cjs || (echo "❌ CJS build missing" && exit 1)
          test -f packages/ui/dist/index.d.ts || (echo "❌ Type declarations missing" && exit 1)
          test -f packages/ui/dist/styles.css || (echo "❌ CSS styles missing" && exit 1)
          echo "✅ All package exports verified"

      - name: Check bundle size
        run: |
          ESM_SIZE=$(wc -c < packages/ui/dist/index.js)
          CJS_SIZE=$(wc -c < packages/ui/dist/index.cjs)
          CSS_SIZE=$(wc -c < packages/ui/dist/styles.css)
          echo "📦 ESM: ${ESM_SIZE} bytes"
          echo "📦 CJS: ${CJS_SIZE} bytes"
          echo "🎨 CSS: ${CSS_SIZE} bytes"
          # Fail if ESM bundle exceeds 500KB (adjust as library grows)
          if [ "$ESM_SIZE" -gt 512000 ]; then
            echo "⚠️ Warning: ESM bundle exceeds 500KB"
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: |
          # Check that no secrets are accidentally committed
          if grep -rn "AKIA\|sk_live\|password\s*=" --include="*.ts" --include="*.tsx" --include="*.js" packages/ apps/ 2>/dev/null; then
            echo "❌ Potential secrets found in source code!"
            exit 1
          fi
          echo "✅ No secrets detected in source code"
