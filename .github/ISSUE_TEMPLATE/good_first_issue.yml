name: Good First Issue
description: A beginner-friendly task
title: "[Good First Issue]: "
labels: ["good first issue", "beginner-friendly"]
body:
  - type: textarea
    attributes:
      label: Task description
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Files to edit
      placeholder: "packages/ui/src/components/button/button.tsx"

  - type: textarea
    attributes:
      label: Step-by-step guide
      description: Simple steps for a beginner

  - type: checkboxes
    attributes:
      label: Skills needed
      options:
        - label: Basic React
        - label: TypeScript (basic types only)
        - label: Tailwind CSS
        - label: Writing docs/markdown
