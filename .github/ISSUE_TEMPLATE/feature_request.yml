name: Feature Request
description: Suggest a new component or feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    attributes:
      label: Type
      options:
        - New Component
        - Component Enhancement
        - New Hook
        - Documentation
        - Performance
        - Accessibility
    validations:
      required: true

  - type: input
    attributes:
      label: Component/Feature name
      placeholder: "e.g. DatePicker, Toast"

  - type: textarea
    attributes:
      label: Problem it solves
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed solution / API design
      placeholder: |
        <DatePicker
          value={date}
          onChange={setDate}
          variant="primary"
        />

  - type: textarea
    attributes:
      label: Alternatives considered
