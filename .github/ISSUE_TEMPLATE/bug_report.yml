name: Bug Report
description: Report a bug in Uibrium
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: input
    attributes:
      label: Component affected
      placeholder: "e.g. Button, Dialog, Select"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import Button from '@uibrium/ui'
        2. Set variant="primary"
        3. Click the button
        4. See error
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    attributes:
      label: Uibrium version
      placeholder: "e.g. 1.0.0"

  - type: dropdown
    attributes:
      label: Browser
      options: [Chrome, Firefox, Safari, Edge, Other]

  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
